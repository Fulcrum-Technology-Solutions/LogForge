name: Lint and Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 black isort mypy
        python -m pip install -e .
    
    - name: Run flake8
      run: |
        flake8 synth_logs tests
    
    - name: Run Black
      run: |
        black --check synth_logs tests
    
    - name: Run isort
      run: |
        isort --check-only --profile black synth_logs tests
    
    - name: Run mypy
      run: |
        mypy synth_logs