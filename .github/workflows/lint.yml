name: Lint and Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        # Install dependencies explicitly to ensure they're available
        python -m pip install pyyaml jinja2 click requests
        # Install the package in development mode
        python -m pip install -e .
    
    - name: Run flake8
      run: |
        # Use a simpler linting rule set for now - just check for syntax errors
        flake8 --select=E9,F63,F7,F82 logforge tests
    
    # Simplified linting - just run flake8 for basic checks
