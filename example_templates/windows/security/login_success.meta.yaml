vendor: Microsoft
product: Windows
data_source: Security Login Success
description: Windows Security successful login events (EventID 4624)
format: XML
frequency: high

# Generator settings for template-based generators
is_generator: true
base_frequency: 0.2
time_patterns:
  - business_hours
  - night_hours
  - weekend
business_hours_multiplier: 2.0
night_hours_multiplier: 0.3
weekend_multiplier: 0.5

# Context values for rendering
context:
  event_id: 4624
  logon_type: 2
  session_id: 1

# Template uses Jinja2 set statement for variable reuse
# This enables consistent entity references throughout the template:
# - set device = registry.get_random_device()
# - set user = registry.get_random_user()
# - set domain = registry.get_domain()
# - set netbios_domain = registry.get_netbios_domain()
# - set lockout_threshold = registry.get_org_setting('account_lockout_threshold', 5)
# 
# The device entity can include:
# - device.hostname: Required device name
# - device.fqdn: Optional fully qualified domain name
# - device.ip_address: Device IP address
# - device.mac_address: Device MAC address
# - device.custom_*: Custom fields defined in entities.yaml
#
# Organization settings:
# - registry.get_domain(): Primary domain name (e.g., "acme.com")
# - registry.get_netbios_domain(): Windows domain name (e.g., "ACME")
# - registry.get_org_setting('setting_name', default_value): Access specific organization settings
#
# Example conditional:
# {% if device.fqdn is defined %}
# <FQDN>{{ device.fqdn }}</FQDN>
# {% else %}
# <FQDN>{{ device.hostname }}.{{ domain }}</FQDN>
# {% endif %}

# Parameter definitions
parameters:
  - name: timestamp
    description: The timestamp of the event
    required: true
  - name: username
    description: The username of the user logging in
    required: true
  - name: domain
    description: The domain of the user
    required: true
  - name: hostname
    description: The hostname of the machine
    required: true
  - name: ip_address
    description: Source IP address of the login
    required: true
  - name: process_id
    description: Process ID of the login process
    required: false
  - name: thread_id
    description: Thread ID of the login process
    required: false

# Example usages
examples:
  - description: Local user login
    parameters:
      username: john.doe
      domain: CONTOSO
      hostname: WIN-DC01
      ip_address: 192.168.1.100
  - description: Remote login
    parameters:
      username: admin
      domain: CONTOSO
      hostname: WIN-DC01
      ip_address: 10.0.0.5
      
# Custom fields demonstration
# The template can access custom fields defined in entities.yaml:
# - device.custom_asset_tag
# - device.custom_location
# - device.custom_department
# 
# Always use the 'is defined' check to ensure the field exists:
# {% if device.custom_asset_tag is defined %}
#   <AssetTag>{{ device.custom_asset_tag }}</AssetTag>
# {% endif %}