# Synthetic Log Generator Configuration

# Entity registry
entity_registry: "entities.yaml"

# Output configuration
outputs:
  # File output is commented out to use HTTP only
  # - type: file
  #   name: file_output
  #   file_path: "logs/synth_logs.json"
  #   max_size: 10485760  # 10MB
  #   backup_count: 5
  #   hourly_rotation: true
  #   data_source_field: "generator"
  
  # HTTP output
  - type: http
    name: http_output
    url: "http://localhost:8080/api/logs"
    method: "POST"
    headers:
      Content-Type: "application/json"
    retry_count: 3
    retry_delay: 1.0
    timeout: 10.0
    verify_ssl: true

# Time patterns
time_patterns:
  - name: business_hours
    base_frequency: 1.0
    start_time: "09:00"
    end_time: "17:00"
    days_of_week: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"]
    multiplier: 2.0
  - name: after_hours
    base_frequency: 0.5
    start_time: "17:00"
    end_time: "09:00"
    days_of_week: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"]
    multiplier: 0.3
  - name: weekend
    base_frequency: 0.2
    start_time: "00:00"
    end_time: "23:59"
    days_of_week: ["SATURDAY", "SUNDAY"]
    multiplier: 0.5

# Active generators - uncomment and add generators as needed
active_generators: 
  - microsoft_windows_security_login_success
  - microsoft_windows_system_service_start
  - paloalto_traffic_session