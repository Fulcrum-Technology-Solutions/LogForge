[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logforge"
version = "0.1.0"
description = "Synthetic event log generator with API-first architecture and Typer CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "LogForge OSS Team" }]
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "typer[all]>=0.12.3",
  "jinja2>=3.1.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "prometheus-client>=0.19.0",
  "pydantic>=2.5.0",
  "faker>=22.0.0",
  "psutil>=5.9.5",
  "jsonschema>=4.19.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.12.0",
  "httpx>=0.26.0",
  "black>=23.12.0",
  "ruff>=0.1.0",
  "mypy>=1.8.0"
]

[project.scripts]
logforge = "logforge.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E203", "E266", "E501"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

