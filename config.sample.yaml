# Synthetic Log Generator Configuration Sample

# Entity registry - path to the registry file
entity_registry: "entities.sample.yaml"

# Network ranges configuration for internal IP address generation
# You can specify ranges using either:
# 1. CIDR notation (e.g., "192.168.0.0/16")
# 2. Start and end IP addresses
# Both methods can include an optional name that can be referenced in templates with random_private_ip('name')
network_ranges:
  # CIDR notation examples
  - cidr: "10.1.0.0/16"
    name: "office"
  - cidr: "172.16.0.0/24"
    name: "servers"
  - cidr: "192.168.0.0/16"
    name: "corporate"
  
  # Start/End IP examples
  - start_ip: "10.2.0.0"
    end_ip: "10.2.255.255"
    name: "datacenter"
  - start_ip: "192.168.1.0"
    end_ip: "192.168.1.255"
    name: "vpn"

# Output configuration
# Initially empty - the application will prompt for output configuration on first run
outputs: []

# Example output configurations:

# File output example:
# - type: file
