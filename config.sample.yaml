# Console output example:
# - type: stdout
#   name: console

# Time patterns
time_patterns:
  # Business hours pattern (9am to 5pm on weekdays)
  - name: business_hours
    base_frequency: 1.0
    start_time: "09:00"
    end_time: "17:00"
    days_of_week: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"]
    multiplier: 2.0
  
  # After hours pattern (5pm to 9am on weekdays)
  - name: after_hours
    base_frequency: 0.5
    start_time: "17:00"
    end_time: "09:00"
    days_of_week: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"]
    multiplier: 0.3
  
  # Weekend pattern
  - name: weekend
    base_frequency: 0.2
    start_time: "00:00"
    end_time: "23:59"
    days_of_week: ["SATURDAY", "SUNDAY"]
    multiplier: 0.5

# Active generators - list of generators to activate
active_generators: []
# Examples:
#  - microsoft_windows_security_login_success
